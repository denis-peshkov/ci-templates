# Reusable workflow: build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Etalon based on Cross.Identity / Cross.CQRS / Cross.CQRS.EF
#
# Minimal caller: package + description. Optional overrides for non-standard layouts.
name: .NET (reusable)

on:
  workflow_call:
    inputs:
      package:
        description: 'Package / project id (e.g. Cross.CQRS.EF). Drives solution, product, sonar paths, nuspec, push glob unless overridden.'
        required: true
        type: string
      description:
        description: 'MSBuild Description property'
        required: true
        type: string
      solution:
        description: 'Override solution file (default: {package}.slnx)'
        required: false
        default: ''
        type: string
      product:
        description: 'Override MSBuild Product (default: {package})'
        required: false
        default: ''
        type: string
      repository_url:
        description: 'Override MSBuild RepositoryUrl (default: https://github.com/{owner}/{package}.git)'
        required: false
        default: ''
        type: string
      sonar_organization:
        description: 'SonarCloud organization'
        required: false
        default: 'denis-peshkov'
        type: string
      sonar_project_key:
        description: 'Override SonarCloud project key (default: {package})'
        required: false
        default: ''
        type: string
      sonar_project_name:
        description: 'Override SonarCloud project name (default: {package})'
        required: false
        default: ''
        type: string
      sonar_sources:
        description: 'Override SonarCloud sources path (default: {package}/)'
        required: false
        default: ''
        type: string
      sonar_tests:
        description: 'Override SonarCloud tests path (default: {package}.Tests/)'
        required: false
        default: ''
        type: string
      sonar_cpd_exclusions:
        description: 'Optional SonarCloud CPD exclusions (e.g. **/ProcessEngine/Definitions/Templates/**)'
        required: false
        default: ''
        type: string
      nuspec_path:
        description: 'Override path to config.nuspec (default: {package}/config.nuspec)'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Override NuGet package id for push glob (default: {package})'
        required: false
        default: ''
        type: string
      build_config:
        description: 'MSBuild configuration'
        required: false
        default: 'Release'
        type: string
      dotnet_versions:
        description: 'dotnet-version input for actions/setup-dotnet'
        required: false
        default: |
          6.0.x
          7.0.x
          8.0.x
          9.0.x
          10.0.x
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      TAGTOKEN:
        required: true

jobs:
  build:
    permissions: # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defining-access-for-the-github_token-scopes
      contents: write
      id-token: write

    env:
      BUILD_CONFIG: ${{ inputs.build_config }}
      PACKAGE: ${{ inputs.package }}
      SOLUTION: ${{ inputs.solution != '' && inputs.solution || format('{0}.slnx', inputs.package) }}
      PRODUCT: ${{ inputs.product != '' && inputs.product || inputs.package }}
      REPOSITORY_URL: ${{ inputs.repository_url != '' && inputs.repository_url || format('https://github.com/{0}/{1}.git', github.repository_owner, inputs.package) }}
      SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key != '' && inputs.sonar_project_key || inputs.package }}
      SONAR_PROJECT_NAME: ${{ inputs.sonar_project_name != '' && inputs.sonar_project_name || inputs.package }}
      SONAR_SOURCES: ${{ inputs.sonar_sources != '' && inputs.sonar_sources || format('{0}/', inputs.package) }}
      SONAR_TESTS: ${{ inputs.sonar_tests != '' && inputs.sonar_tests || format('{0}.Tests/', inputs.package) }}
      NUSPEC_PATH: ${{ inputs.nuspec_path != '' && inputs.nuspec_path || format('{0}/config.nuspec', inputs.package) }}
      PACKAGE_NAME: ${{ inputs.package_name != '' && inputs.package_name || inputs.package }}
      QUALITY_GATE_WAIT: ${{ github.event_name == 'pull_request' }}

    runs-on: ubuntu-22.04 # ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disabling shallow clones is recommended for improving the relevancy of reporting
          # Avoid persisting GITHUB_TOKEN so tag push can authenticate as TAGTOKEN (admin ruleset bypass).
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_versions }}

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.0

      - name: Setup GitVersion
        # v1.x only allows GV >=5.2 <6.1; 6.8.x needs actions v4.7.x
        # https://github.com/GitTools/actions/blob/main/docs/versions.md
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        # defaults to configFilePath: GitVersion.yml (useConfigFile removed in v3+/v4)

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          dotnet build "$SOLUTION" --configuration "$BUILD_CONFIG" --no-restore \
            -p:Configuration=$BUILD_CONFIG \
            -p:Version=${GitVersion_SemVer} \
            -p:AssemblyVersion=${GitVersion_AssemblySemVer} \
            -p:FileVersion=${GitVersion_AssemblySemFileVer} \
            -p:InformationalVersion="${GitVersion_InformationalVersion}" \
            -p:Company="Denis Peshkov" \
            -p:Product="${PRODUCT}" \
            -p:Description="${{ inputs.description }}" \
            -p:RepositoryUrl="${REPOSITORY_URL}" \
            -p:RepositoryType=git \
            -p:CLSCompliant=true \
            -p:NeutralLanguage=en

      - name: Run tests
        run: >
          dotnet test /p:Configuration=$BUILD_CONFIG
          --no-restore
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v5 # Ex: v4.0.0, See the latest version at https://github.com/marketplace/actions/sonarcloud-scan
        with:
          args: >
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
            -Dsonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
            -Dsonar.sources=${{ env.SONAR_SOURCES }}
            -Dsonar.tests=${{ env.SONAR_TESTS }}
            ${{ inputs.sonar_cpd_exclusions != '' && format('-Dsonar.cpd.exclusions={0}', inputs.sonar_cpd_exclusions) || '' }}
            -Dsonar.qualitygate.wait=${{ env.QUALITY_GATE_WAIT }}
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Update nuspec version
        uses: denis-peshkov/update-nuspec-action@v2

      - name: Nuget Pack
        run: nuget pack ${{ env.NUSPEC_PATH }} -Symbols -Version ${{ env.semVer }}

      # Git tags: only stable SemVer on master/release/hotfix.
      - name: Create git Tag
        if: >
          !contains(env.semVer, '-') &&
          (
            github.ref == 'refs/heads/master' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.ref, 'refs/heads/hotfix/')
          )
        run: |
          git tag v${{ env.semVer }}

      - name: Push git Tag
        if: >
          !contains(env.semVer, '-') &&
          (
            github.ref == 'refs/heads/master' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.ref, 'refs/heads/hotfix/')
          )
        run: |
          git config --global user.name 'Denis Peshkov'
          git config --global user.email 'denis.peshkov@outlook.com'
          git remote set-url origin https://x-access-token:${{ secrets.TAGTOKEN }}@github.com/${{ github.repository }}
          git push origin v${{ env.semVer }}

      - name: NuGet login (OIDC → temp API key)
        if: >
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/heads/hotfix/') ||
          github.ref == 'refs/heads/dev'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: peshkov

      - name: Nuget Push
        if: >
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/heads/hotfix/') ||
          github.ref == 'refs/heads/dev'
        run: nuget push **/${{ env.PACKAGE_NAME }}.${{ env.semVer }}.symbols.nupkg -ApiKey ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -Source "https://api.nuget.org/v3/index.json" -SkipDuplicate
